name: Print Ninebot Data

on:
  workflow_dispatch:
    inputs:
      month:
        description: 'Month to fetch, e.g. 202607 or 2026-07. Empty means current Asia/Shanghai month.'
        required: false
        default: ''
      all_months:
        description: 'Fetch historical months. Set to true to export every discovered month.'
        required: false
        default: 'false'
      start_month:
        description: 'Optional first historical month, e.g. 202401. Used when all_months=true.'
        required: false
        default: ''
      incremental:
        description: 'Use Notion latest Start Time as sync start month and skip already synced trips.'
        required: false
        default: 'true'
  schedule:
    # GitHub Actions cron is UTC. These run daily at 12:00 and 22:00 Asia/Shanghai.
    - cron: '0 4 * * *'
    - cron: '0 14 * * *'

permissions:
  contents: read

jobs:
  print-data:
    runs-on: ubuntu-latest
    env:
      NINEBOT_ACCESS_TOKEN: ${{ secrets.NINEBOT_ACCESS_TOKEN }}
      NINEBOT_REFRESH_TOKEN: ${{ secrets.NINEBOT_REFRESH_TOKEN }}
      NINEBOT_BUSINESS_UID: ${{ secrets.NINEBOT_BUSINESS_UID }}
      NINEBOT_WNUMBER: ${{ secrets.NINEBOT_WNUMBER }}
      NINEBOT_VEHICLE_TYPE: ${{ secrets.NINEBOT_VEHICLE_TYPE }}
      NINEBOT_RN_VERSION: ${{ secrets.NINEBOT_RN_VERSION }}
      NINEBOT_DEVICE_ID: ${{ secrets.NINEBOT_DEVICE_ID }}
      NINEBOT_BUSINESS_TYPE: ${{ secrets.NINEBOT_BUSINESS_TYPE }}
      NINEBOT_ALL_MONTHS: ${{ github.event.inputs.all_months == 'true' && '1' || '0' }}
      NINEBOT_START_MONTH: ${{ github.event.inputs.start_month }}
      NINEBOT_INCREMENTAL: ${{ github.event.inputs.all_months == 'true' && '0' || github.event.inputs.incremental == 'false' && '0' || '1' }}
      NINEBOT_SKIP_STABLE_KEYS_FILE: data/cloud-export/existing-stable-keys.txt
      NINEBOT_REFRESH_WITH_NINECLI: "0"
      NINEBOT_MONTH: ${{ github.event.inputs.month }}
      NINEBOT_EXPORT_DIR: data/cloud-export
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_PARENT_PAGE_ID: ${{ secrets.NOTION_PARENT_PAGE_ID }}
      NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
      NOTION_TITLE_PROPERTY: ${{ secrets.NOTION_TITLE_PROPERTY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Print configured secret status
        run: |
          for name in \
            NINEBOT_ACCESS_TOKEN \
            NINEBOT_REFRESH_TOKEN \
            NINEBOT_BUSINESS_UID \
            NINEBOT_WNUMBER \
            NINEBOT_VEHICLE_TYPE \
            NINEBOT_RN_VERSION \
            NINEBOT_DEVICE_ID; do
            if [ -n "${!name}" ]; then
              echo "$name configured"
            else
              echo "$name missing"
            fi
          done

      - name: Load Notion sync state
        if: ${{ env.NINEBOT_INCREMENTAL == '1' && env.NOTION_TOKEN != '' && env.NOTION_DATABASE_ID != '' }}
        run: |
          if [ -n "${NINEBOT_MONTH}" ]; then
            python scripts/notion_existing_keys.py \
              --month "${NINEBOT_MONTH}" \
              --output "${NINEBOT_SKIP_STABLE_KEYS_FILE}"
          else
            python scripts/notion_existing_keys.py \
              --from-latest-start \
              --output "${NINEBOT_SKIP_STABLE_KEYS_FILE}"
          fi

      - name: Fetch all Ninebot cloud trips and details
        run: |
          if [ "$NINEBOT_ALL_MONTHS" = "1" ]; then
            if [ -n "$NINEBOT_START_MONTH" ]; then
              python scripts/ninebot_cloud_export.py --all-months --start-month "$NINEBOT_START_MONTH" --export-dir "$NINEBOT_EXPORT_DIR"
            else
              python scripts/ninebot_cloud_export.py --all-months --export-dir "$NINEBOT_EXPORT_DIR"
            fi
          elif [ -n "$NINEBOT_MONTH" ]; then
            python scripts/ninebot_cloud_export.py --month "$NINEBOT_MONTH" --export-dir "$NINEBOT_EXPORT_DIR"
          elif [ "$NINEBOT_INCREMENTAL" = "1" ] && [ -n "$NINEBOT_SYNC_START_MONTH" ]; then
            python scripts/ninebot_cloud_export.py --all-months --start-month "$NINEBOT_SYNC_START_MONTH" --export-dir "$NINEBOT_EXPORT_DIR"
          else
            python scripts/ninebot_cloud_export.py --export-dir "$NINEBOT_EXPORT_DIR"
          fi

      - name: Print fetched trip data
        run: python scripts/print_trips.py --export-dir "$NINEBOT_EXPORT_DIR"

      - name: Sync trips to Notion
        if: ${{ env.NOTION_TOKEN != '' && env.NOTION_DATABASE_ID != '' }}
        run: python scripts/ninebot_notion_sync.py --sync --export-dir "$NINEBOT_EXPORT_DIR"

      - name: Upload export artifact
        uses: actions/upload-artifact@v4
        with:
          name: ninebot-cloud-export
          path: data/cloud-export
          if-no-files-found: error
